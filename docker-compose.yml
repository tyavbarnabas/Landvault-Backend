services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: landvault-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-landvault}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - landvault_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-landvault}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local fake SMTP server + web inbox. Reset codes are read from the web UI
  # at http://localhost:1080 during development — nothing it receives can
  # ever reach a real person's inbox, which is the entire point of it. See
  # AGENTS.md for why this rather than a provider account or console logging.
  maildev:
    # Pinned, deliberately not `latest`: untagged pulls 3.0.0-rc.3, a release
    # candidate whose web UI 404s at `/` (only /index.html resolves). Verified
    # directly — don't "modernise" this to an untagged image.
    image: maildev/maildev:2.1.0
    container_name: landvault-maildev
    restart: unless-stopped
    ports:
      - "${MAILDEV_WEB_PORT:-1080}:1080"   # web UI
      - "${MAILDEV_SMTP_PORT:-1025}:1025"  # SMTP

volumes:
  landvault_postgres_data:
