services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: landvault-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-landvault}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - landvault_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-landvault}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  landvault_postgres_data:
