# Local-development-only overrides. `dev` is the local default (see
# AGENTS.md) — never active unless explicitly selected, but assumed on a
# developer's own machine.
#
# SQL logging lives here, not in the base config: it's noisy, and bind
# parameters can expose personal data — this slice's `directors` table holds
# an NDPR-regulated id_number value that must never land in a shared log.
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  # MailDev, from docker-compose.yml — a local fake SMTP server whose inbox
  # is at http://localhost:1080. No auth, no TLS: it accepts anything and
  # delivers to nobody, which is exactly what a development mail path should
  # do. Only the host/port/credentials differ between here and a real
  # provider — EmailOtpDeliveryService itself is environment-agnostic.
  mail:
    host: localhost
    port: ${MAILDEV_SMTP_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# Re-enabled here — see the base application.yml for why they're off by
# default. SecurityConfig separately permits these paths only when `dev`
# is active, matching this.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Local development runs over plain http. Everywhere else the refresh cookie
# is Secure; see the base config.
app:
  refresh-token:
    cookie-secure: false
  # Swagger UI is dev-only and served by this app itself, so its requests
  # carry this app's own Origin. Appended here (never in the base config) so
  # OriginGuard lets Swagger call refresh and logout; whatever
  # CORS_ALLOWED_ORIGINS says still applies.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8443},http://localhost:${SERVER_PORT:8080}
