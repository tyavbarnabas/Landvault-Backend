spring:
  application:
    name: landvault-backend
  # Plot import (FU-1) uploads a GeoJSON file. Boot's 1MB default is too
  # tight for a 500-plot survey export at full coordinate precision.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    # The APPLICATION's own runtime connection — deliberately NOT the
    # superuser Liquibase migrates with below. A superuser (or any
    # BYPASSRLS role) unconditionally bypasses row-level security, which
    # would make every RLS policy in the schema silently inert. See
    # AGENTS.md and changeset 019.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:landvault}
    username: ${APP_DB_USERNAME:landvault_app}
    password: ${APP_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    # Hibernate 6 auto-detects PostGIS spatial support from hibernate-spatial +
    # postgis-jdbc on the classpath — no dialect is set here on purpose. If
    # geometry mapping ever misbehaves, an explicit `hibernate.dialect` is the
    # first thing to revisit, but don't set one pre-emptively.
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    # A separate, explicit connection from spring.datasource above — this
    # one stays the superuser (DB_USERNAME/DB_PASSWORD), since migrations
    # need CREATE EXTENSION / CREATE ROLE / GRANT privileges the app's own
    # restricted role deliberately doesn't have. `url` is repeated
    # explicitly (not left to fall back to the primary datasource bean) so
    # Liquibase is guaranteed to build its own connection rather than
    # silently reusing the app's — see AGENTS.md.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:landvault}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
    parameters:
      appDbUsername: ${APP_DB_USERNAME:landvault_app}
      appDbPassword: ${APP_DB_PASSWORD}

# spring.mail.* is deliberately absent here, with no default host.
# application-dev.yml points at MailDev; every other environment sets its own
# (SPRING_MAIL_HOST/SPRING_MAIL_PORT/… bind straight through). A deployment
# that forgets fails at STARTUP — with no host there is no JavaMailSender
# bean, so EmailOtpDeliveryService cannot be constructed — rather than
# booting fine and silently sending into a container that isn't there. Same
# fail-loud-on-missing-config rule as JWT_SECRET. See AGENTS.md.

server:
  port: ${SERVER_PORT:8080}

landvault:
  bootstrap:
    # Creates the platform's first Super Admin account on startup — see
    # SuperAdminBootstrap and AGENTS.md. Defaults to disabled: an ordinary
    # startup does nothing at all. Never set BOOTSTRAP_SUPER_ADMIN=true
    # permanently — set it, restart once, then unset it again.
    super-admin:
      enabled: ${BOOTSTRAP_SUPER_ADMIN:false}
      email: ${BOOTSTRAP_SUPER_ADMIN_EMAIL:}
      first-name: ${BOOTSTRAP_SUPER_ADMIN_FIRST_NAME:}
      last-name: ${BOOTSTRAP_SUPER_ADMIN_LAST_NAME:}
      password: ${BOOTSTRAP_SUPER_ADMIN_PASSWORD:}

  # Staff invitations (SI-1..SI-7). `delivery` works exactly like otp.delivery:
  # email (default) or log — and `log` is for tests only, because it writes a
  # live credential into a company to the application log.
  # File storage (estate photos, documents) over the S3 API. The endpoint and
  # keys differ per deployment and have NO defaults here: a deployment that
  # forgets them fails at startup. The local RustFS values are in application-dev.yml.
  # The two buckets must differ (checked at startup). See AGENTS.md, "File storage".
  storage:
    endpoint: ${STORAGE_ENDPOINT:}
    # R2 uses "auto"; RustFS and S3 a real region name.
    region: ${STORAGE_REGION:auto}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    path-style-access: ${STORAGE_PATH_STYLE:true}
    public-bucket: ${STORAGE_PUBLIC_BUCKET:}
    private-bucket: ${STORAGE_PRIVATE_BUCKET:}
    # Where public files are served from (the CDN domain), never the app's own domain.
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:}
    upload-link-ttl: 10m
    download-link-ttl: 5m
    # An upload not confirmed within this is abandoned and cleaned up.
    pending-ttl: 24h
    sweep-interval: 1h
    # The platform's ceiling; each feature sets its own, lower, limit.
    max-upload-size: 100MB
    connect-timeout: 5s
    read-timeout: 30s
  # Paystack (payments). The secret key comes from the environment only and is
  # never logged; a missing key fails startup. TEST keys start sk_test_.
  paystack:
    base-url: https://api.paystack.co
    secret-key: ${PAYSTACK_SECRET_KEY:}
    # The FRONTEND page Paystack sends the buyer back to. Arriving there proves
    # nothing — a payment counts only once verified with Paystack.
    callback-url: ${PAYSTACK_CALLBACK_URL:http://localhost:8443/payments/return}
    connect-timeout: 5s
    read-timeout: 15s
  payments:
    alerts:
      # Who is told when a payout account changes. "log" is for tests only.
      delivery: ${PAYMENT_ALERT_DELIVERY:email}
      from-address: ${MAIL_FROM:noreply@hometrue.com.ng}
    # Pressing pay again inside this window hands back the open link instead
    # of opening a second payment for the same plot.
    link-reuse-window: 30m
    # PY-5: a purchase with nothing paid is abandoned this long after its hold
    # ends (a Paystack transfer account lasts 30 minutes), and the plot released.
    abandon-grace: 15m
    sweep-interval: 5m
  payouts:
    # Paystack's cap on ONE transfer for our account (found live: ₦10,000,000).
    # A sale above it is paid in equal parts. If Paystack raises the cap, change
    # this number; a sale already part-paid keeps its original split.
    max-transfer-amount: 10000000
    # TR-3: how often Paystack is asked about payouts whose outcome we don't know,
    # and when one counts as stuck (no reply at all / accepted but not finished).
    sweep-interval: 15m
    stuck-sending-after: 5m
    stuck-pending-after: 30m
  instalments:
    # Phase 4: instalment reminders (7 days and 1 day before, first day overdue,
    # entering arrears), once a day at 08:00 Lagos time. Moves no money.
    reminder-cron: "0 0 8 * * *"
  resale:
    # Sell my plot: once a day at 00:30 Lagos, listings past 90 days, or that a rule
    # says must come down, are taken down.
    sweep-cron: "0 30 0 * * *"
    # The developer's emails (phase 4). `delivery` works like invitations.delivery; "log" is for tests only.
    delivery: ${RESALE_DELIVERY:email}
    from-address: ${MAIL_FROM:noreply@hometrue.com.ng}
    review-url: ${RESALE_REVIEW_URL:http://localhost:8443/portal/resale}
  refunds:
    # How often Paystack is asked about refunds it accepted but hasn't finished.
    sweep-interval: 15m
    stuck-after: 30m
  # The public "request onboarding" form (POST /api/onboarding-requests).
  # `delivery` works like invitations.delivery; "log" is for tests only.
  documents:
    # The frontend's verify page; every document's QR code opens {verify-url}/{code}.
    # Printed on documents, so it must be the public address.
    verify-url: ${DOCUMENTS_VERIFY_URL:http://localhost:8443/verify}
    # Security parameters: the public verify route, per connection.
    verify-requests-per-window: 30
    verify-window: 1m
  onboarding:
    delivery: ${ONBOARDING_DELIVERY:email}
    from-address: ${MAIL_FROM:noreply@hometrue.com.ng}
    # Where new requests are announced.
    alert-to: ${ONBOARDING_ALERT_TO:admin@hometrue.com.ng}
    # Promised in the confirmation email ("our team will contact you ...").
    response-time: within 2 working days
    # Security parameters: each accepted submission sends two emails.
    submissions-per-window: 5
    window: 1h
    # A `new` request older than this many working days (Mon-Fri, in time-zone)
    # is flagged needsAttention. Public holidays are not known and count.
    attention-after-working-days: 2
    time-zone: Africa/Lagos
  invitations:
    delivery: ${INVITATION_DELIVERY:email}
    from-address: ${MAIL_FROM:noreply@hometrue.com.ng}
    # The frontend page the link opens; the token follows after #token=.
    accept-url: ${INVITATION_ACCEPT_URL:http://localhost:8443/accept-invitation}
    ttl: 72h
    # Security parameters: they stop resend being a way to flood an inbox.
    resend-min-interval: 2m
    max-sends: 5
    # A branch manager's request waits this long for an approver, then lapses.
    request-ttl: 14d
    # The portal page an approver is pointed to in the "request to review" email.
    review-url: ${INVITATION_REVIEW_URL:http://localhost:8443/portal/staff/invitations}
  otp:
    # One-time codes (password reset today). Every value here is a security
    # parameter — see AGENTS.md before widening one.
    #
    # `delivery` selects the OtpDeliveryService implementation:
    #   email (default) — EmailOtpDeliveryService, real SMTP via JavaMailSender
    #   log             — LoggingOtpDeliveryService, writes the code to the log
    #
    # `log` is for tests and CI only. It must never be selected in a real
    # environment: it would write live reset codes into the application log,
    # which is exactly what every other path here refuses to do.
    delivery: ${OTP_DELIVERY:email}
    # Never hardcoded in the sending code — a deployment sets its own.
    from-address: ${MAIL_FROM:noreply@hometrue.com.ng}
    code-ttl: 10m
    # A 6-digit code is a million combinations — without an attempt limit it
    # is trivially brute-forceable. Exhausting this invalidates the code.
    max-attempts: 5
    # Caps code generation per account per window, so the endpoint can't be
    # used to flood an inbox or run up delivery costs.
    rate-limit-max-requests: 3
    rate-limit-window: 15m

  kyc:
    # No default: a missing key must fail startup, not silently write an
    # NDPR-regulated NIN in plaintext. Same rule as JWT_SECRET and
    # TOTP_ENCRYPTION_KEY, and a SEPARATE key from the latter — one leaked
    # key should not yield both every buyer's NIN and the ability to mint
    # second factors. Generate with `openssl rand -base64 32`.
    encryption-key: ${KYC_ENCRYPTION_KEY}

  # SB-1: an estate's boundary must sit inside its declared state (GRID3 state
  # boundaries, changeset 064). The margin absorbs border-data imprecision and
  # estates on a border; a transposed boundary lands hundreds of km away, so
  # it doesn't hide one. Turned off only on the test classpath — see AGENTS.md.
  estates:
    state-check:
      enabled: true
      margin-metres: 1000
    # Option C (decided with the user): a correction to a PUBLISHED estate's
    # boundary that changes more than this share of its land (land added plus
    # land removed, as % of the old area) waits for a Super Admin. Smaller
    # corrections, and any on an unpublished estate, apply at once.
    boundary-correction:
      review-threshold-pct: 5
  checkout:
    # RS-1's 45-minute plot hold. Configuration so a test can shorten it,
    # not so it can be negotiated per buyer: a hold cannot be extended
    # (RS-5), and every minute added for one buyer is a minute taken from
    # whoever is waiting behind them.
    hold-duration: 45m
    # How often expired holds are returned to the pool. The plot is unheld
    # from expires-at, not from the sweep — nothing can reserve it in
    # between — so this is how long a released plot stays invisible, not a
    # window in which two people could hold it.
    sweep-interval: 60s

  two-fa:
    # No default: a missing key must fail startup, not silently store TOTP
    # secrets in a form anyone with database access could use. Same rule as
    # JWT_SECRET. Generate with `openssl rand -base64 32`.
    encryption-key: ${TOTP_ENCRYPTION_KEY}
    # ±1 30-second window, ~90 seconds of clock-drift tolerance. Widening
    # this multiplies the codes valid at any instant — it is a security
    # parameter, not a comfort setting.
    allowed-drift-windows: 1
    # A TOTP code is continuously valid, unlike a reset code, so an
    # unthrottled endpoint is a standing million-guess target.
    max-failed-attempts: 5
    # Time-based, not permanent: a TOTP user can't request a fresh code the
    # way a password-reset user can, so a permanent lock would strand them.
    lockout-duration: 15m
    # The pending-login handle's lifetime — long enough to open an
    # authenticator app, short enough to limit a leaked challenge.
    challenge-ttl: 5m
    recovery-code-count: 10

app:
  jwt:
    # No default: a missing JWT_SECRET must fail startup, not silently run
    # with a made-up key. See JwtService and AGENTS.md.
    secret: ${JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  # The refresh token's cookie, grace window and retention — see AGENTS.md.
  refresh-token:
    cookie-name: lv_refresh
    # True everywhere except the dev profile. Safari does not reliably treat
    # http://localhost as secure for cookies, so dev turns it off explicitly
    # rather than relying on the browser.
    cookie-secure: true
    # Strict: the cookie is only ever sent by the app's own fetch calls. The
    # Origin check (OriginGuard) covers what SameSite cannot — subdomains
    # are the same site. Moving the frontend cross-site means None here
    # (which requires cookie-secure), and the Origin check already covers it.
    cookie-same-site: Strict
    # Only refresh and logout need it; not sent on every API call.
    cookie-path: /api/auth
    # A token rotated this recently, whose successor is still live, gets a
    # sibling instead of a family revoke (a second tab or a retried request).
    # A security parameter: widening it widens the replay window for a thief.
    reuse-grace: 10s
    # Rows are deleted this long after expiry, not at it, so a recent theft
    # can still be investigated.
    cleanup-retention: 30d
    cleanup-interval: 1h
  cors:
    # ~/landvault's Vite dev server default — see its AGENTS.md.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8443}

# API documentation is a development affordance, not a production endpoint
# (see AGENTS.md) — disabled here so the OpenAPI document isn't even
# generated outside dev, not just unreachable. SecurityConfig also gates
# the docs paths behind the dev profile as a second, independent layer.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
