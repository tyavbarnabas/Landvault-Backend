spring:
  application:
    name: landvault-backend
  datasource:
    # The APPLICATION's own runtime connection — deliberately NOT the
    # superuser Liquibase migrates with below. A superuser (or any
    # BYPASSRLS role) unconditionally bypasses row-level security, which
    # would make every RLS policy in the schema silently inert. See
    # AGENTS.md and changeset 019.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:landvault}
    username: ${APP_DB_USERNAME:landvault_app}
    password: ${APP_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    # Hibernate 6 auto-detects PostGIS spatial support from hibernate-spatial +
    # postgis-jdbc on the classpath — no dialect is set here on purpose. If
    # geometry mapping ever misbehaves, an explicit `hibernate.dialect` is the
    # first thing to revisit, but don't set one pre-emptively.
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    # A separate, explicit connection from spring.datasource above — this
    # one stays the superuser (DB_USERNAME/DB_PASSWORD), since migrations
    # need CREATE EXTENSION / CREATE ROLE / GRANT privileges the app's own
    # restricted role deliberately doesn't have. `url` is repeated
    # explicitly (not left to fall back to the primary datasource bean) so
    # Liquibase is guaranteed to build its own connection rather than
    # silently reusing the app's — see AGENTS.md.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:landvault}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
    parameters:
      appDbUsername: ${APP_DB_USERNAME:landvault_app}
      appDbPassword: ${APP_DB_PASSWORD}

# spring.mail.* is deliberately absent here, with no default host.
# application-dev.yml points at MailDev; every other environment sets its own
# (SPRING_MAIL_HOST/SPRING_MAIL_PORT/… bind straight through). A deployment
# that forgets fails at STARTUP — with no host there is no JavaMailSender
# bean, so EmailOtpDeliveryService cannot be constructed — rather than
# booting fine and silently sending into a container that isn't there. Same
# fail-loud-on-missing-config rule as JWT_SECRET. See AGENTS.md.

server:
  port: ${SERVER_PORT:8080}

landvault:
  bootstrap:
    # Creates the platform's first Super Admin account on startup — see
    # SuperAdminBootstrap and AGENTS.md. Defaults to disabled: an ordinary
    # startup does nothing at all. Never set BOOTSTRAP_SUPER_ADMIN=true
    # permanently — set it, restart once, then unset it again.
    super-admin:
      enabled: ${BOOTSTRAP_SUPER_ADMIN:false}
      email: ${BOOTSTRAP_SUPER_ADMIN_EMAIL:}
      first-name: ${BOOTSTRAP_SUPER_ADMIN_FIRST_NAME:}
      last-name: ${BOOTSTRAP_SUPER_ADMIN_LAST_NAME:}
      password: ${BOOTSTRAP_SUPER_ADMIN_PASSWORD:}

  otp:
    # One-time codes (password reset today). Every value here is a security
    # parameter — see AGENTS.md before widening one.
    #
    # `delivery` selects the OtpDeliveryService implementation:
    #   email (default) — EmailOtpDeliveryService, real SMTP via JavaMailSender
    #   log             — LoggingOtpDeliveryService, writes the code to the log
    #
    # `log` is for tests and CI only. It must never be selected in a real
    # environment: it would write live reset codes into the application log,
    # which is exactly what every other path here refuses to do.
    delivery: ${OTP_DELIVERY:email}
    # Never hardcoded in the sending code — a deployment sets its own.
    from-address: ${MAIL_FROM:noreply@landvault.com}
    code-ttl: 10m
    # A 6-digit code is a million combinations — without an attempt limit it
    # is trivially brute-forceable. Exhausting this invalidates the code.
    max-attempts: 5
    # Caps code generation per account per window, so the endpoint can't be
    # used to flood an inbox or run up delivery costs.
    rate-limit-max-requests: 3
    rate-limit-window: 15m

  two-fa:
    # No default: a missing key must fail startup, not silently store TOTP
    # secrets in a form anyone with database access could use. Same rule as
    # JWT_SECRET. Generate with `openssl rand -base64 32`.
    encryption-key: ${TOTP_ENCRYPTION_KEY}
    # ±1 30-second window, ~90 seconds of clock-drift tolerance. Widening
    # this multiplies the codes valid at any instant — it is a security
    # parameter, not a comfort setting.
    allowed-drift-windows: 1
    # A TOTP code is continuously valid, unlike a reset code, so an
    # unthrottled endpoint is a standing million-guess target.
    max-failed-attempts: 5
    # Time-based, not permanent: a TOTP user can't request a fresh code the
    # way a password-reset user can, so a permanent lock would strand them.
    lockout-duration: 15m
    # The pending-login handle's lifetime — long enough to open an
    # authenticator app, short enough to limit a leaked challenge.
    challenge-ttl: 5m
    recovery-code-count: 10

app:
  jwt:
    # No default: a missing JWT_SECRET must fail startup, not silently run
    # with a made-up key. See JwtService and AGENTS.md.
    secret: ${JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  cors:
    # ~/landvault's Vite dev server default — see its AGENTS.md.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8443}

# API documentation is a development affordance, not a production endpoint
# (see AGENTS.md) — disabled here so the OpenAPI document isn't even
# generated outside dev, not just unreachable. SecurityConfig also gates
# the docs paths behind the dev profile as a second, independent layer.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
