# Test-classpath overrides. This file adds to src/main/resources/application.yml
# (different filename, so it layers on top rather than replacing it) — keep it
# to the few keys tests genuinely need to differ on.

# Tests and CI use the logging delivery, so the suite never needs a MailDev
# container running to assert a code was generated. EmailOtpDeliveryService is
# the real default everywhere else — see AGENTS.md. Setting this anywhere but
# a test classpath would write live reset codes to the application log.
landvault.otp.delivery=log

# The production key has no default on purpose (a missing one must fail
# startup rather than store TOTP secrets readably), so tests supply their own.
# Obviously fake, fixed so encrypted values are reproducible across runs, and
# scoped to the test classpath — it can never reach a real environment.
landvault.two-fa.encryption-key=bGFuZHZhdWx0LXRlc3Qtb25seS1rZXktMzJieXRlcyE=

# Every IT that browses the public marketplace does so from 127.0.0.1, so the
# real limit (120/min) would trip mid-suite and fail tests for the wrong
# reason. MarketplaceRateLimitIT overrides this back down to test the limiter
# itself.
landvault.marketplace.rate-limit.requests-per-window=100000
